<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshat — Software Developer</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter & JetBrains Mono Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-[100dvh] w-full overflow-x-hidden bg-[#fafaf9] text-stone-900 dark:bg-[#0c0a09] dark:text-stone-100 font-sans antialiased flex flex-col justify-between p-5 sm:p-10 md:p-12 select-none relative">

    <!-- Subtle Chessboard Watermark -->
    <div class="pointer-events-none absolute inset-0 opacity-[0.03] dark:opacity-[0.045]" style="background-image: conic-gradient(#78716c 90deg, transparent 90deg 180deg, #78716c 180deg 270deg, transparent 270deg); background-size: 72px 72px;"></div>

    <!-- Top Row -->
    <header class="relative z-10 w-full flex items-center justify-between text-xs font-mono text-stone-400 dark:text-stone-500">
        <span class="flex items-center gap-2 font-medium text-stone-800 dark:text-stone-200 tracking-tight py-1">
            <span class="text-base leading-none">♞</span> akxat.in
        </span>
        <span id="moveCoord" class="transition-opacity duration-200 py-1">1. e4 · e5</span>
    </header>

    <!-- Center Content -->
    <main class="relative z-10 w-full max-w-lg mx-auto text-center my-auto py-8 px-2 sm:px-4">
        <!-- Minimal Knight Emblem -->
        <div id="knightBadge" class="inline-flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-stone-900 text-stone-50 dark:bg-stone-100 dark:text-stone-900 text-xl sm:text-2xl shadow-sm ring-1 ring-black/5 dark:ring-white/10 mb-5 sm:mb-7 transition-transform duration-300 hover:-translate-y-0.5">
            ♞
        </div>

        <p class="font-mono text-[10px] sm:text-[11px] uppercase tracking-[0.22em] text-stone-400 dark:text-stone-500 mb-2.5 sm:mb-3">
            Opening Move
        </p>

        <h1 class="text-3xl sm:text-5xl font-bold tracking-tight text-stone-900 dark:text-stone-50 mb-3.5 sm:mb-4">
            Myself, Akshat.
        </h1>

        <p class="text-[15px] sm:text-[17px] text-stone-500 dark:text-stone-400 mb-7 sm:mb-9 leading-relaxed max-w-md mx-auto font-normal">
            Solo software developer crafting clean, thoughtful code — one calculated move at a time.
        </p>

        <!-- Primary Actions -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-center gap-2.5 sm:gap-3 max-w-xs sm:max-w-none mx-auto mb-6 sm:mb-7">
            <a href="https://github.com/akxat22" target="_blank" rel="noopener noreferrer" class="px-6 py-3.5 sm:py-3 text-sm font-medium text-stone-50 bg-stone-900 hover:bg-stone-800 dark:bg-stone-100 dark:text-stone-900 dark:hover:bg-stone-200 rounded-xl shadow-sm transition-all duration-150 active:scale-95">
                GitHub ↗
            </a>
            <button onclick="makeMove()" class="px-5 py-3.5 sm:py-3 text-sm font-medium text-stone-700 dark:text-stone-300 bg-stone-200/70 hover:bg-stone-200 dark:bg-stone-900 dark:hover:bg-stone-800 border border-stone-300/60 dark:border-stone-800 rounded-xl transition-all duration-150 active:scale-95">
                Your Move ♟
            </button>
        </div>

        <!-- Live Projects -->
        <div class="flex flex-wrap items-center justify-center gap-2 max-w-md mx-auto mb-6 sm:mb-7">
            <a href="https://villagesim.akxat.in/" target="_blank" rel="noopener noreferrer" title="Village simulation game demo" class="px-3.5 py-2 text-xs font-mono text-stone-700 dark:text-stone-300 bg-stone-200/50 hover:bg-stone-200/90 dark:bg-stone-900/80 dark:hover:bg-stone-800/90 border border-stone-300/50 dark:border-stone-800 rounded-lg transition-all duration-150 active:scale-95">
                Village Sim ↗
            </a>
            <a href="https://resumemaker.akxat.in" target="_blank" rel="noopener noreferrer" title="Build a clean resume" class="px-3.5 py-2 text-xs font-mono text-stone-700 dark:text-stone-300 bg-stone-200/50 hover:bg-stone-200/90 dark:bg-stone-900/80 dark:hover:bg-stone-800/90 border border-stone-300/50 dark:border-stone-800 rounded-lg transition-all duration-150 active:scale-95">
                Resume Maker ↗
            </a>
            <a href="https://builder.akxat.in" target="_blank" rel="noopener noreferrer" title="Architect floor map builder" class="px-3.5 py-2 text-xs font-mono text-stone-700 dark:text-stone-300 bg-stone-200/50 hover:bg-stone-200/90 dark:bg-stone-900/80 dark:hover:bg-stone-800/90 border border-stone-300/50 dark:border-stone-800 rounded-lg transition-all duration-150 active:scale-95">
                Floor Builder ↗
            </a>
        </div>

        <!-- Minimal Social & Chess Links -->
        <nav aria-label="Social Links" class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1 text-xs font-mono text-stone-500 dark:text-stone-400">
            <a href="https://www.linkedin.com/in/akxat22" target="_blank" rel="noopener noreferrer" class="px-2.5 py-2 rounded-lg hover:text-stone-900 dark:hover:text-stone-100 hover:bg-stone-200/50 dark:hover:bg-stone-900/80 transition-colors">
                LinkedIn ↗
            </a>
            <span class="text-stone-300 dark:text-stone-700 select-none">·</span>
            <button onclick="copyEmail()" class="px-2.5 py-2 rounded-lg hover:text-stone-900 dark:hover:text-stone-100 hover:bg-stone-200/50 dark:hover:bg-stone-900/80 transition-colors">
                Gmail
            </button>
            <span class="text-stone-300 dark:text-stone-700 select-none">·</span>
            <a href="https://www.chess.com/member/InsaneBanda" target="_blank" rel="noopener noreferrer" class="px-2.5 py-2 rounded-lg hover:text-stone-900 dark:hover:text-stone-100 hover:bg-stone-200/50 dark:hover:bg-stone-900/80 transition-colors">
                Chess.com ↗
            </a>
        </nav>
    </main>

    <!-- Bottom Row -->
    <footer class="relative z-10 w-full flex items-center justify-between text-[11px] sm:text-xs font-mono text-stone-400 dark:text-stone-500">
        <span>&copy; 2026 akxat.in</span>
        <a href="https://github.com/akxat22" target="_blank" rel="noopener noreferrer" class="py-1 hover:text-stone-700 dark:hover:text-stone-300 transition-colors">@akxat22</a>
    </footer>

    <!-- Minimal Toast Notification -->
    <div id="toast" class="fixed bottom-14 sm:bottom-16 left-1/2 -translate-x-1/2 z-20 max-w-[90vw] truncate bg-stone-900 dark:bg-stone-100 text-stone-50 dark:text-stone-900 text-xs font-mono px-4 py-2.5 rounded-xl shadow-md opacity-0 translate-y-1 transition-all duration-200 pointer-events-none">
        1. e4 — Let's build something great.
    </div>

    <script>
        const moves = [
            { coord: "1. e4 · e5", text: "1. e4 — Let's build something great." },
            { coord: "1. Nf3 · d5", text: "1. Nf3 — Clean architecture ahead." },
            { coord: "1. d4 · Nf6", text: "1. d4 — Solid foundations first." },
            { coord: "1. c4 · e5", text: "1. c4 — Challenge me @InsaneBanda." }
        ];
        let moveIndex = 0;
        let timer;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-1');
            clearTimeout(timer);
            timer = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-1');
            }, 2400);
        }

        function makeMove() {
            const current = moves[moveIndex % moves.length];
            const moveCoord = document.getElementById('moveCoord');
            const badge = document.getElementById('knightBadge');

            moveCoord.textContent = current.coord;
            moveIndex++;

            // Subtle knight nudge
            badge.style.transform = 'translateY(-3px)';
            setTimeout(() => badge.style.transform = '', 180);

            showToast(current.text);
        }

        function copyEmail() {
            const email = "akxat22@gmail.com";
            const tempInput = document.createElement("input");
            tempInput.value = email;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast("Copied akxat22@gmail.com");
        }
    </script>
</body>
</html>
