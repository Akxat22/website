<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshat — Software Developer</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter & JetBrains Mono Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen w-screen overflow-hidden bg-stone-100 text-stone-900 dark:bg-stone-950 dark:text-stone-100 font-sans flex flex-col justify-between p-6 sm:p-10 select-none relative">

    <!-- Subtle Chessboard Square Watermark in Background -->
    <div class="pointer-events-none absolute inset-0 opacity-[0.04] dark:opacity-[0.06]" style="background-image: conic-gradient(#78716c 90deg, transparent 90deg 180deg, #78716c 180deg 270deg, transparent 270deg); background-size: 96px 96px;"></div>

    <!-- Top Row: Minimal Chess Rank/File Coordinate Header -->
    <header class="relative z-10 w-full max-w-3xl mx-auto flex items-center justify-between text-xs font-mono text-stone-500 dark:text-stone-400">
        <span class="flex items-center gap-2 font-semibold text-stone-800 dark:text-stone-200">
            <span class="text-base leading-none">♞</span> akxat.in
        </span>
        <span>e4 · e5</span>
    </header>

    <!-- Center Content: No-Scroll Intro Card -->
    <main class="relative z-10 w-full max-w-xl mx-auto text-center my-auto px-4">
        <!-- Minimal Chess Knight Emblem -->
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-stone-900 text-stone-50 dark:bg-stone-100 dark:text-stone-900 text-3xl shadow-sm mb-6 transition-transform duration-300 hover:-translate-y-1">
            ♞
        </div>

        <p class="font-mono text-xs uppercase tracking-widest text-stone-500 dark:text-stone-400 mb-3">
            Opening Move
        </p>

        <h1 class="text-3xl sm:text-5xl font-bold tracking-tight mb-4">
            Myself, Akshat.
        </h1>

        <p class="text-base sm:text-lg text-stone-600 dark:text-stone-400 mb-8 leading-relaxed max-w-md mx-auto">
            Solo software developer crafting clean, thoughtful code — one calculated move at a time.
        </p>

        <div class="flex items-center justify-center gap-3">
            <a href="https://github.com/akxat22" target="_blank" rel="noopener noreferrer" class="px-6 py-3 text-sm font-semibold text-stone-50 bg-stone-900 hover:bg-stone-800 dark:bg-stone-100 dark:text-stone-900 dark:hover:bg-stone-200 rounded-xl transition-all active:scale-95">
                GitHub ↗
            </a>
            <button onclick="makeMove()" class="px-5 py-3 text-sm font-semibold text-stone-800 dark:text-stone-200 bg-stone-200/80 hover:bg-stone-300/80 dark:bg-stone-800 dark:hover:bg-stone-700 rounded-xl transition-all active:scale-95">
                Your Move ♟
            </button>
        </div>
    </main>

    <!-- Bottom Row: Minimal Footer -->
    <footer class="relative z-10 w-full max-w-3xl mx-auto flex items-center justify-between text-xs font-mono text-stone-400 dark:text-stone-500">
        <span>&copy; 2026 akxat.in</span>
        <a href="https://github.com/akxat22" target="_blank" rel="noopener noreferrer" class="hover:text-stone-700 dark:hover:text-stone-300 transition-colors">@akxat22</a>
    </footer>

    <!-- Simple Toast Notification -->
    <div id="toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-20 bg-stone-900 dark:bg-stone-100 text-stone-50 dark:text-stone-900 text-xs font-mono px-4 py-2.5 rounded-xl shadow-lg opacity-0 transition-opacity duration-200 pointer-events-none whitespace-nowrap">
        1. Nf3 — Ready to build!
    </div>

    <script>
        const moves = [
            "1. e4 — Let's build something great.",
            "1. Nf3 — Clean architecture ahead.",
            "1. d4 — Solid foundations first.",
            "1. c4 — Ready when you are."
        ];
        let moveIndex = 0;
        let timer;

        function makeMove() {
            const toast = document.getElementById('toast');
            toast.textContent = moves[moveIndex % moves.length];
            moveIndex++;
            toast.classList.remove('opacity-0');
            clearTimeout(timer);
            timer = setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }
    </script>
</body>
</html>
